spring:
  datasource:
    url: jdbc:h2:mem:security;MODE=Oracle;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
app:
  ai:
    maintenance-enabled: false
  security:
    issuer: https://test.invalid
    audience: security-tests
    allowed-origins: https://frontend.test.invalid
    require-https: false
    token-seconds: 300
